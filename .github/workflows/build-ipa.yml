name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-kmp-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-kmp-

      - name: Build Kotlin framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build app
        run: |
          cd iosApp
          xcodebuild -project FunPayTools.xcodeproj -scheme FunPayTools \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > xcodebuild.log 2>&1 || { grep -E "error:|Undefined|ld:" xcodebuild.log | head -80; exit 1; }
          grep -E "\*\* BUILD" xcodebuild.log

      - name: Package IPA (ad-hoc signed with entitlements for re-signing tools)
        run: |
          mkdir -p out/Payload
          cp -R iosApp/build/Build/Products/Release-iphoneos/FunPayTools.app out/Payload/
          APP=out/Payload/FunPayTools.app
          if [ -d "$APP/PlugIns/FunPayWidgets.appex" ]; then
            codesign --force --sign - --entitlements iosApp/Widget/Widget.entitlements "$APP/PlugIns/FunPayWidgets.appex"
          fi
          codesign --force --sign - --entitlements iosApp/iosApp/App.entitlements "$APP"
          ls -la "$APP" "$APP/PlugIns" || true
          cd out && zip -qry FunPayTools.ipa Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: FunPayTools-ipa
          path: out/FunPayTools.ipa
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" out/Payload/FunPayTools.app/Info.plist)
          TAG="ios-v${VER}-build${{ github.run_number }}"
          gh release create "$TAG" out/FunPayTools.ipa \
            --title "FunPay Tools iOS ${VER} (build ${{ github.run_number }})" \
            --notes "Неподписанный .ipa. Установка: Sideloadly / AltStore / ESign / TrollStore (подпишут своим сертификатом)." \
            --latest
