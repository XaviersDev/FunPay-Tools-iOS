name: Build IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ${{ runner.os }}-kmp-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-kmp-

      - name: Build Kotlin framework
        run: ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd iosApp && xcodegen generate

      - name: Build app
        run: |
          cd iosApp
          xcodebuild -project FunPayTools.xcodeproj -scheme FunPayTools \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tail -n 60
          test -d build/Build/Products/Release-iphoneos/FunPayTools.app

      - name: Package IPA
        run: |
          mkdir -p out/Payload
          cp -R iosApp/build/Build/Products/Release-iphoneos/FunPayTools.app out/Payload/
          cd out && zip -qry FunPayTools.ipa Payload && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: FunPayTools-ipa
          path: out/FunPayTools.ipa
          retention-days: 30
