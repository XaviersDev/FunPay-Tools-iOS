name: FunPayTools
options:
  bundleIdPrefix: ru.allisighs
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.4.2"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_BITCODE: "NO"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: "NO"
targets:
  FunPayTools:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - "*.entitlements"
    dependencies:
      - target: FunPayWidgets
        embed: true
        codeSign: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.allisighs.funpaytools
        PRODUCT_NAME: FunPayTools
        INFOPLIST_FILE: iosApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS: "-framework Shared -lc++ -framework WebKit -framework JavaScriptCore -framework AVFoundation -framework AVFAudio -framework CoreMotion -framework PhotosUI -framework Photos -framework UserNotifications -framework Security -framework AudioToolbox -framework UniformTypeIdentifiers -framework Metal -framework MetalKit -framework CoreText -framework QuartzCore -framework CoreGraphics -framework CoreServices -framework SystemConfiguration -framework Network"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEAD_CODE_STRIPPING: "YES"
  FunPayWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Widget
        excludes:
          - "*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.allisighs.funpaytools.widgets
        PRODUCT_NAME: FunPayWidgets
        INFOPLIST_FILE: Widget/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: "YES"
        APPLICATION_EXTENSION_API_ONLY: "YES"
